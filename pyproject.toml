[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-library"
version = "0.3.0"
description = "A local workbench and Python library for recursive improvement loops."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rsi-library = "rsi_library.__main__:main"
rsi-gateway = "rsi_library.gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["rsi_library*"]

[tool.setuptools.package-data]
rsi_library = ["static/*", "benchmark_results.json"]
"rsi_library.gateway" = ["static/*", "static/fonts/*"]
